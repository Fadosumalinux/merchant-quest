services:
  - type: web
    name: merchant-quest-api
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma db push
    startCommand: npx tsx src/index.ts
    envVars:
      - key: DATABASE_URL
        value: file:./prod.db
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 3001
